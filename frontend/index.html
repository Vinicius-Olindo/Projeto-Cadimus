<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadimus - Gestor Financeiro</title>
    <meta name="description" content="Gestor financeiro para a casa e para o seu bolso." />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#a97a2f" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cadimus" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/variables.css?v=101" />
    <link rel="stylesheet" href="css/style.css?v=199" />
  </head>
  <body>
    <main class="app-container">
      <!-- SEÇÃO DASHBOARD -->
      <section id="dashboard-section" style="display: none">
        <div id="app-header-root"></div>

        <nav class="dashboard-visoes" aria-label="Organização da tela inicial">
          <button type="button" class="dashboard-visao-btn" data-dashboard-visao="dashboard">Dashboard</button>
          <button type="button" class="dashboard-visao-btn ativo" data-dashboard-visao="hoje">Lançamentos</button>
          <button type="button" class="dashboard-visao-btn" data-dashboard-atalho="planejamento">Planejamento</button>
          <button type="button" class="dashboard-visao-btn" data-dashboard-atalho="relatorios">Relatórios</button>
        </nav>

        <div id="conteudo-periodo">
          <!-- LINHA 1: grade de indicadores, ocupa a largura toda — o "painel de controle" -->
          <div class="stat-grid area-resumo">
            <div class="card stat-card stat-card-receita stat-card-atalho" id="resumo-receitas-item" data-resumo-card="receitas" role="button" tabindex="0" title="Ver detalhes das receitas" aria-label="Ver detalhes das receitas">
              <div class="stat-card-topo">
                <span class="stat-card-icone">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </span>
                <span class="stat-rotulo">Receitas</span>
              </div>
              <span class="stat-valor texto-receita" id="total-receitas">R$ 0,00</span>
              <span class="stat-desc" id="receitas-desc">Entradas pagas neste período.</span>
            </div>
            <div class="card stat-card stat-card-despesa stat-card-atalho" data-resumo-card="despesas" role="button" tabindex="0" title="Ver detalhes das despesas" aria-label="Ver detalhes das despesas">
              <div class="stat-card-topo">
                <span class="stat-card-icone">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4-4m0 0l4-4m-4 4h11a4 4 0 0 1 0 8h-1"/></svg>
                </span>
                <span class="stat-rotulo">Despesas</span>
              </div>
              <span class="stat-valor texto-despesa" id="total-despesas">R$ 0,00</span>
              <span class="stat-desc" id="despesas-desc">Saídas do período, pagas e pendentes.</span>
              <span class="comparacao-mes" id="comparacao-mes" style="display: none"></span>
            </div>
            <div class="card stat-card stat-card-pendente stat-card-atalho" id="resumo-pendente-item" data-resumo-card="pendentes" role="button" tabindex="0" title="Ver compromissos a pagar" aria-label="Ver compromissos a pagar" style="display: none">
              <div class="stat-card-topo">
                <span class="stat-card-icone">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </span>
                <span class="stat-rotulo">A pagar</span>
              </div>
              <span class="stat-valor" id="total-pendente" style="color: var(--cor-pendente)">R$ 0,00</span>
              <span class="stat-desc" id="pendente-desc">Compromissos ainda pendentes.</span>
            </div>
            <div class="card stat-card stat-card-saldo stat-card-atalho" data-resumo-card="saldo" role="button" tabindex="0" title="Ver composição do saldo" aria-label="Ver composição do saldo">
              <div class="stat-card-topo">
                <span class="stat-card-icone">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                </span>
                <span class="stat-rotulo">Saldo do período</span>
              </div>
              <span class="stat-valor" id="saldo-total">R$ 0,00</span>
              <span class="stat-desc" id="saldo-desc">Receitas menos despesas e transferências.</span>
            </div>
            <div class="card stat-card stat-card-guarda" id="card-guarda" style="display: none">
              <div class="stat-card-topo">
                <span class="stat-card-icone">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2"/><circle cx="17" cy="11" r="1"/></svg>
                </span>
                <span class="stat-rotulo">Capacidade de guarda</span>
              </div>
              <span class="stat-valor" id="valor-guarda" style="color: var(--cor-receita)">R$ 0,00</span>
              <span class="stat-desc" id="guarda-desc"></span>
            </div>
            <div class="card stat-card stat-card-poupanca" id="card-poupanca" style="display: none">
              <div class="stat-card-topo">
                <span class="stat-card-icone">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </span>
                <span class="stat-rotulo">Taxa de poupança</span>
              </div>
              <span class="stat-valor" id="taxa-poupanca" style="color: var(--cor-receita)">0%</span>
              <span class="stat-desc" id="poupanca-desc"></span>
            </div>
          </div>

          <!-- GRID LIVRE: cards do dashboard e lançamentos -->
          <div id="entries-dashboard-root"></div>

          <!-- Cards analíticos inseridos no grid livre -->
          <div id="dashboard-side-cards-root"></div>
        </div>
      </section>

    </main>

    <div id="modal-components-root"></div>

    <!-- RODAPÉ -->
    <div id="app-footer-root"></div>
    <script src="js/page-script-loader.js?v=100"></script>
    <script src="js/dashboard-loader.js?v=122"></script>
  </body>
</html>
