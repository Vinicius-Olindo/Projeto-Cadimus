  <body data-cadimus-page="cadastro">
    <main class="app-container">
    <!-- MODAL: CADASTRO POR CONVITE (público) -->
    <section id="cadastro-section" style="display: none">
      <div class="login-container">
        <div class="login-card">
          <h2>Criar sua conta</h2>
          <p id="cadastro-convite-info"></p>
          <form id="form-cadastro-convite">
            <input type="hidden" id="cadastro-token" value="" />
            <input type="text" id="cadastro-nome" placeholder="Seu nome" required />
            <input type="text" id="cadastro-usuario" placeholder="Usuário (login)" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required />
            <input type="password" id="cadastro-senha" placeholder="Crie uma senha (mín. 6 caracteres)" autocomplete="new-password" required minlength="6" />
            <input type="password" id="cadastro-confirmar-senha" placeholder="Confirme a senha" autocomplete="new-password" required minlength="6" />
            <p id="cadastro-erro" class="erro-convite" style="display: none"></p>
            <button type="submit">Criar conta</button>
          </form>
          <a href="login.html" class="link-voltar-login">Voltar para o login</a>
        </div>
      </div>
    </section>


    </main>
    <div id="modal-aviso" class="modal-overlay" role="dialog" aria-modal="true" style="display: none">
      <div class="modal-content modal-compacto">
        <p id="aviso-texto" class="modal-aviso-texto"></p>
        <button type="button" id="btn-aviso-ok">OK</button>
      </div>
    </div>

    <!-- MODAL: CONFIRMAÇÃO (substitui confirm()) -->
    <div id="modal-confirmacao" class="modal-overlay" role="dialog" aria-modal="true" style="display: none">
      <div class="modal-content modal-compacto">
        <p id="confirmacao-texto" class="modal-aviso-texto"></p>
        <div class="modal-confirmacao-acoes">
          <button type="button" id="btn-confirmacao-confirmar">Confirmar</button>
          <button type="button" id="btn-confirmacao-cancelar">Cancelar</button>
        </div>
      </div>
    </div>
